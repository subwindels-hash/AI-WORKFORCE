# AI_WORKFORCE — production stack (CodeIgniter 3 + MySQL/MariaDB)
#
# NOTE (honesty per project rules): this compose file targets the documented
# production stack (PHP-FPM + MySQL). It was NOT exercised in the development
# sandbox (no Docker there); the identical application IS tested there via
# WASM PHP + pdo_sqlite (runtime/). Validate on your host before use.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${AI_WORKFORCE_DB_PASS:-ai_workforce}
      MARIADB_DATABASE: ai_workforce_trading
      MARIADB_USER: ai_workforce
      MARIADB_PASSWORD: ${AI_WORKFORCE_DB_PASS:-ai_workforce}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  app:
    image: php:8.2-apache
    working_dir: /var/www/html
    environment:
      AI_WORKFORCE_DB_HOST: db
      AI_WORKFORCE_DB_USER: ai_workforce
      AI_WORKFORCE_DB_PASS: ${AI_WORKFORCE_DB_PASS:-ai_workforce}
      AI_WORKFORCE_DB_NAME: ai_workforce_trading
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        docker-php-ext-install mysqli >/dev/null &&
        a2enmod rewrite &&
        apache2-foreground"

volumes:
  db-data:
